name: Run All Checks

# Manual entry point that fans out every non-release validation workflow
# from one button. Useful when you want a full sweep without pushing a
# new commit — e.g. after rebasing on `main`, when a flaky check needs
# a retry, or when triaging a regression and you'd rather see all
# results in one place than chase each workflow tab.
#
# `workflow_dispatch` is the only trigger; the regular push/PR triggers
# on each downstream workflow are NOT removed by this — they still fire
# normally for their own events.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  security:
    name: Security
    uses: ./.github/workflows/security.yml
