name: CI

permissions:
  contents: read

# Triggers:
#   - pull_request: gate every PR against main before merge.
#   - push: main: re-run on the merge SHA so the badge in README and
#     branch protection track main's actual state.
#   - workflow_dispatch: manual revalidation lever.
#   - workflow_call: invoked by release.yml on tag push and by
#     run-all.yml for a manual full sweep.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (typecheck + unit + smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned to the runtime version reflected in @types/bun and the
          # author's local environment. Bump deliberately when upgrading.
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun test

      - name: Smoke test (entry point end-to-end)
        # Pipes a minimal valid stdin payload into src/index.ts and asserts
        # the statusline runs to completion and emits non-empty output. This
        # catches runtime bugs that the unit tests miss because they exercise
        # individual components rather than the parseStdin → render → log
        # pipeline (e.g. broken Intl.Segmenter usage, git subprocess spawn
        # errors, parent-process detection on Linux).
        run: |
          output=$(echo '{"model":{"display_name":"Opus 4.7 (1M context)"},"context_window":{"used_percentage":42},"cost":{"total_cost_usd":1.50,"total_duration_ms":60000}}' | bun src/index.ts)
          if [ -z "$output" ]; then
            echo "Smoke test failed: statusline produced no output"
            exit 1
          fi
          echo "$output" | grep -q "Opus" || {
            echo "Smoke test failed: output is missing the model name"
            echo "Got: $output"
            exit 1
          }
          echo "Smoke test passed"

  # Aggregate gate. Wire this as the single required status check for
  # branch protection so the rule doesn't need updating whenever the
  # job matrix changes.
  ci-success:
    name: CI success
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Aggregate gate results
        run: |
          set -euo pipefail
          test_result="${{ needs.test.result }}"
          echo "test=$test_result"
          if [ "$test_result" != "success" ]; then
            echo "::error::test job did not succeed (result=$test_result)"
            exit 1
          fi
          echo "All gates passed."
