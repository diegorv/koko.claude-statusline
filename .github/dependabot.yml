version: 2
updates:
  # Bun ecosystem — reads package.json + bun.lock from the repo root.
  # Native support since Dependabot added Bun in 2024.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: "development"
    commit-message:
      prefix: "deps"

  # GitHub Actions versions across all workflows under .github/workflows.
  # `directory: "/"` is correct — Dependabot resolves to the workflows
  # dir from the repo root automatically.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
